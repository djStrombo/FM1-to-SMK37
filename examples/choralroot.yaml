# ChoralRoot (an Orchid-style chord instrument, a Felucca fork from a copied tree near 1.0.4) on the SMK-37, as an
# upstream PR. A full fork with its own UI (cr_ui.c), its own boot stub in front of the app and a commit marker
# (docs/BOOT-SAFETY.md), 19 stored objects plus loop slots. Controls: SMK37.md on the branch smk37.

firmware:
  name: ChoralRoot              # unchanged on the SMK-37: same name, boot and manual
  upstream: https://github.com/Quixotic7/ChoralRootFM1
  base: ChoralRoot 0.22 dev (aa5875a)
  family: felucca
  board_layer: by_hand          # no common history: the Felucca 1.6 layer's files and hunks applied by hand
  lost_on_smk: [TRS MIDI IN / clock in]
  priorities:
    - one hand chords, the other roots: the chord block reachable as a grid, the roots on the keybed
    - the boot stub's rescue (OCTAVE- at power-on) and the commit marker kept

delivery:
  mode: upstream
  pr: Quixotic7/ChoralRootFM1#14
  fork: ""                      # the porter's fork of ChoralRootFM1 (no Felucca history to share a fork network)
  package: choralroot-smk37.fwsc   # -elite, -mke
  usb_name: ChoralRoot FM-1     # unchanged (the USB product string); "choral" and "fm-1" are in every filter
  data_family: CHORAL           # own family: ChoralRoot's objects are not Felucca's
  copyright: "M. Geisler (genkigenki/makkuro)"

models: [pro, elite, mke]

keys:
  middle: notes                 # all 37 keys play roots: the chord block's functions moved to the pads
  outer: extend                 # roots at their own pitch
  velocity: factory             # Options > Velocity gets a value 0 "keys" (the SMK default); 1..127 fixed as on the FM-1

pads:
  pattern: function_keys        # docs/06 "Function keys on the pads": the keybed's modifier keys moved to the pads
  map:
    top: [DIM, MIN, MAJ, SUS, Strum, Strum 2 Oct, Slop, Harp]          # hardware pads 0..7
    bottom: ["6", m7, M7, "9", LOCK, Arpeggiate, Arp 2 Oct, Pattern]   # hardware pads 8..15
  behaviour: >-
    exactly the FM-1's chord keys: held while held, combinations as with the keys, LOCK latches as on the FM-1;
    no latching of our own. Mode pads: a tap picks the mode and switches the performance on, the playing mode's pad
    again off (cu_perf_pick / cu_perf_toggle, the PERF button's and layer's own state). The chord pads call the key handlers (cu_mod_press / cu_mod_release, B3's tap / hold) through
    smk_pad_take; the keybed keys F3..C#4 play notes
  lesson: >-
    first version mirrored the chord block as a grid plus performance-mode pads; the owner rejected it: functions on
    the pads, the keybed free for playing, layout by meaning, original behaviour; the pads left over: the mode
    pickers, a colour per group
  colours: screen               # types white, extensions orange, LOCK blue, modes cyan (free timing) / green (synced)
  velocity: false               # (functions)

faders:
  pattern: banks
  takeover: soft
  bank_button: FADER BANK
  banks:
    A: [chord send Drive, chord send Chorus, chord send Delay, chord send Reverb]   # the Sends page's order
    B: [bass send Drive, bass send Chorus, bass send Delay, bass send Reverb]
  screen: bar                   # the popup an incoming CC 91 / 93 / 94 shows

wheels:
  pitch: {target: bend, range_semitones: 2, applies_to: both parts}   # also MIDI out on the CHORD / BASS channels
  mod: {target: vibrato, detail: "5.5 Hz, up to +-1/2 semitone, both parts; CC1 to the MODW source"}
  calibration: auto

rules:
  no_doubles: true              # the chord functions live on the pads only

knobs:
  layout: fm1                   # K1 MASTER, K2-K4 SELECT / ALGORITHM / PRESETS, K5-K8 KNOB 1-4

buttons:
  map: printed                  # SCALE = KEY (SEL), CHORD = BASS (ENV), NOTE REPEAT = LATCH (LFO), PARA = EDIT,
                                # GLOBE = OPT (GLO), PATCH = HOME, BT = SAVE, ARP = PERF, SEQ PLAY = LOOP, SEQ REC = REC
  extra:
    KNOB BANK: the view menu (as HOME held)
    FADER BANK: the fader bank (chord / bass sends)
    "<": SELECT -1 where SELECT pages or picks; on the view the view before
    ">": SELECT +1 there; on the view the view after

power_on:
  OCTAVE-: the boot stub's rescue (update mode); the SMK stub reads the SMK matrix, blinks OCTAVE-'s LED
  OCTAVE- + OCTAVE+: hardware calibration
  OCTAVE- + OCTAVE+ + PATCH held 5 s: update mode

screen:
  style: keep                   # the footers keep the FM-1's printed names; SMK37.md translates
