# Vector37: a new firmware (in progress), a vector synth built on the SMK board layer. One screen, the orbit.
# Shows the "redesign" path: the panel is mapped for the instrument, not for an FM-1 workflow.

firmware:
  name: Vector37
  upstream: ""              # new firmware; board layer from the Makkuro37 / Snoop37 work
  base: Makkuro37 board layer
  family: other
  priorities:
    - play first: one screen, no menus
    - the four corners of the sound under your fingers
    - every touch visible on the orbit screen

delivery:
  mode: fork
  usb_name: Vector37
  data_family: its own     # never reads another port's store
  boot_logo: VECTOR37 intro
  credit: genkigenki

models: [pro, elite, mke]

keys:
  middle: fm1               # all 37 keys play; voices show as sun and moon on the orbit
  outer: extend
  outer_drums: {}
  velocity: factory

pads:
  pattern: xy               # four 2x2 groups; in each group top left = corner 1, top right 2, bottom left 3, bottom right 4
  order: reading
  colours: custom           # by job: SELECT blue, MODE amber, FILTER violet, MUTE red
  idle: dim
  playhead: bright          # every pad as bright as its corner is heard now
  picker:
    enabled: false
  velocity: false
  notes: >
    pads 1-2: SELECT a corner for K1-K5 (hold two: several); 3-4: MODE (next modulation);
    5-6: FILTER (next type; held 0.5 s: key tracking); 7-8: MUTE (held: solo while held)

faders:
  pattern: mixer
  takeover: soft
  bank_button: ""
  banks: {}
  fixed: [reverb, delay, chorus, volume]
  screen: bar               # a bar over the orbit for a moment

wheels:
  pitch:
    target: bend
    range_semitones: 2
    applies_to: all
  mod:
    target: macro
    detail: suborbit size (the moon's ring grows)
  calibration: auto

knobs:
  layout: custom
  K1: GEN 1                 # the selected corners' first overtone pattern
  K2: GEN 2
  K3: BLEND
  K4: CUTOFF
  K5: RESONANCE
  K6: SUBORBIT SIZE
  K7: SUBORBIT SPEED
  K8: WARP
  step: detent
  hold_sets:                # a held button lends the knobs eight jobs; the screen lists them while held
    SEQ: [shape, rate, size, rotate, warp y, centre x, centre y, warp x]
    CHORD: [attack, decay, sustain, release, detune, glide, stack, stereo]
    FX: [drive, drive colour, chorus depth, chorus speed, delay time, feedback, reverb size, reverb colour]
    FADER BANK: [tune 1, tune 2, level, track, mode, filter, follower level, bend range]
    ARP: [mode, tempo, orbit attack, orbit decay, orbit sustain, orbit release]

buttons:
  map: custom
  extra:
    KNOB BANK: "held, the help"
    FADER BANK: "held, knobs = CORNER+"
    "<": previous sound
    ">": next sound
  custom:
    SEQ: "tap, next path shape; held, knobs = ORBIT"
    CHORD: "tap, POLY / DUAL / MONO; held, knobs = VOICE"
    ARP: "tap, arpeggiator on / off; held, knobs = ARP"
    SEQ REC: LATCH
    SEQ PLAY: tap tempo
    NOTE REPEAT: RETRIGGER
    GLOBE: FOCUS on a corner
    PARA: RANDOMIZE; held, UNDO
    PATCH: all notes off

screen:
  style: redesign           # the orbit: four planets = the four corners, sun and moon = the voice
  colours: corners rose, amber, violet, teal; pad groups by job
  rules:
    - the orbit leads; everything you touch shows there first
    - same place: the screen's corners are the pad groups' corners
    - one control, one job; no menus

pedal: none

open_questions: []
