# GHOULBOX (a dungeon-synth groovebox, a Felucca 1.4.1 fork) on the SMK-37, as an upstream PR.
# A full fork: its own key path (chords, drone latch, KEYS SPLIT / LAYER), its own power-on combos and a crank on
# SELECT. Controls: SMK37.md on genkigenki/Felucca ghoulbox-smk37.

firmware:
  name: GHOULBOX                # unchanged on the SMK-37: same name, boot and manual
  upstream: https://github.com/jasonpersinger/ghoulbox-fm1-dungeon-synth
  base: GHOULBOX 2.1 (Felucca 1.4.1)
  family: felucca
  board_layer: felucca          # the Felucca layer's target and emulator fix, then the per-model and installer commits
  lost_on_smk: [TRS MIDI IN / clock in]
  priorities:
    - the GHOULBOX workflow and manual unchanged
    - outer keys that play like the middle keys (chords, drone latch, splits)

delivery:
  mode: upstream
  pr: jasonpersinger/ghoulbox-fm1-dungeon-synth#5
  fork: genkigenki/Felucca ghoulbox-smk37   # the porter's Felucca fork, one branch per project
  package: ghoulbox-smk37.fwsc  # -elite, -mke
  usb_name: Felucca             # unchanged
  data_family: GHOULBX          # 1..7 characters; own family: GHOULBOX moved settings bytes

models: [pro, elite, mke]

keys:
  middle: fm1
  outer: extend                 # through the fork's key_on / key_off: chord, drone latch, velocity; SPLIT and LAYER too
  velocity: factory             # passed in by the caller (the fork's key_on_to has no key index)

pads:
  pattern: steps                # white keys F3..G5, low notes on the bottom row; grids (DRUM, NAME, layers) read like text
  colours: screen               # the theme colour

faders:
  pattern: banks
  takeover: soft
  bank_button: FADER BANK
  banks:
    A: [level 1, level 2, level 3, level 4]
    B: [pan 1, pan 2, pan 3, pan 4]
    C: [reverb 1, reverb 2, reverb 3, reverb 4]
    D: [delay 1, delay 2, delay 3, delay 4]

wheels:
  pitch: {target: bend, range_semitones: 2, applies_to: selected}   # the MIDI channel's bend range; also sent as MIDI
  mod: {target: macro, detail: "CC1, the MOD matrix's MODW source"}
  calibration: auto

knobs:
  layout: fm1                   # K1 MASTER, K2-K4 SELECT / ALGORITHM / PRESETS, K5-K8 KNOB 1-4
  notes: SELECT is also GURDY's crank (reads enc_dfr; SMK frames are 625/s, the FM-1's 909/s)

buttons:
  map: printed                  # FX SCL ENV LFO EDIT GLO on FX SCALE CHORD NOTE-REPEAT PARA GLOBE; PATCH = HOME, BT = SAVE
  extra:
    KNOB BANK: the menu (as HOME held)
    FADER BANK: the fader bank
    "<": previous page of the group (in the menu: row)
    ">": next page of the group (on HOME: HOME tapped)

power_on:                       # the fork's own combos, moved to the SMK's OCTAVE buttons
  OCTAVE-: USB RESCUE
  OCTAVE- + OCTAVE+: hardware calibration
  OCTAVE- + OCTAVE+ held 5 s: update mode

screen:
  style: keep
