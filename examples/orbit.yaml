# ORBIT (a SLOOP / Felucca groovebox with an OP-1-style Event Tape) on the SMK-37, as an upstream PR.
# A SLOOP fork without git history (a v2.3 snapshot with 2.4.1, 2.5 and 2.6 merged by hand): the SLOOP 2.6 layer
# cherry-picks onto it file by file. Controls: SMK37.md on branch smk37.

firmware:
  name: ORBIT                   # unchanged on the SMK-37: same name, boot word mark and screens
  upstream: https://github.com/dspaudio/orbit
  base: ORBIT 0.7.0 (SLOOP 2.6 functional, no shared history)
  family: sloop
  board_layer: sloop            # genkigenki/sloop-fm1 smk37, 8fad1a1..smk37, without its web commits
  lost_on_smk: [TRS MIDI IN / clock in, user sample slots USR3 and USR4]
  priorities:
    - ORBIT's workflow and GUIDE unchanged (Event Tape, Mixer, macros, the four coloured encoders)
    - the faders as the Mixer's pages
    - the installer page writes the right package per keyboard

delivery:
  mode: upstream
  pr: dspaudio/orbit#4
  fork: genkigenki/orbit, branch smk37 (to be created by the owner)
  package: orbit-smk37.fwsc     # -elite, -mke
  usb_name: Felucca             # ORBIT kept SLOOP's USB product string: every installer already probes it
  data_family: ORBIT            # own family: ORBIT's ORP7 / OPB2 formats are not SLOOP's FUN6; untagged data cleared

models: [pro, elite, mke]

keys:
  middle: fm1
  outer: extend                 # synth tracks: notes; drum track: SLOOP's outer drums (ORBIT kept the 16 lanes)
  velocity: factory

pads:
  pattern: steps                # reading order; SEL held: piano; SAVE held: sections
  colours: screen               # from TE_COL at run time: ORBIT's STYLE is blue, green, WHITE, orange (not SLOOP's yellow)
  picker:
    enabled: true
    knob: none                  # K4 keeps ORBIT's own preset list on the screen (it loads on the turn)
    open: KNOB BANK             # opens / closes, PATCH closes; LED lit while open
    page: "< >"
    kinds: gathered             # ORBIT's list starts with its own sounds of mixed kinds: a kind is collected from the whole list

faders:
  pattern: banks
  takeover: soft
  bank_button: FADER BANK
  banks:
    A: [level 1, level 2, level 3, level 4 (drums: GLO > DRUMS LVL)]
    B: [pan 1, pan 2, pan 3, pan 4]               # the Mixer's two pages are LEVEL and PAN
    C: [reverb 1, reverb 2, reverb 3, reverb 4]
    D: [delay 1, delay 2, delay 3, delay 4]
  mapping: one table (fb_param) for the screen and the faders; fader 0..127 to the value's range

wheels:
  pitch: {target: bend, range_semitones: 7, applies_to: selected}
  mod: {target: vibrato, detail: 10 Hz, up to +-1 semitone}
  calibration: auto

knobs:
  layout: fm1                   # K1 MASTER, K2 SELECT, K3 ALGORITHM, K4 PRESETS, K5-K8 KNOB 1-4 (blue, green, white, orange)

buttons:
  map: printed
  extra:
    KNOB BANK: the pad sound picker
    FADER BANK: the fader bank screen
    "<": page back (SEQ held: step page; visualizer: style)
    ">": page forward

screen:
  style: keep

lessons:
  - A fork without shared history still takes the layer by cherry-pick (three-way per file). Expect "deleted in HEAD"
    for files the fork moved (web/make_site.py -> tools/make_site.py) and conflicts at every file whose last line the
    fork changed (ORBIT appends a blank line to most files): take the layer's hunk and keep the fork's blank line.
  - The SLOOP layer carries indirections for the optional Snoop37 look (BRAND_*, VIS_STYLES, MI_SYS0). A fork with its
    own name and screens drops them and keeps its literals; check panel.c, ui_menu.c, ui_vis.c, main.c, recovery.c
    and the test harnesses.
  - RAM: ORBIT left 1.2 KB of .data/.bss on the FM-1 and the layer needs more (the first SMK link overflowed by 664 B).
    The pad LED frame (634 B) and the factory velocity curves (530 B) move to the zeroed .pool section; the SMK build
    then has 0.5 KB left. Check `RAM .data+.bss` in the build log of every SMK build.
  - Forks with their own host harnesses (ORBIT: macro_test, midi_learn_test, orbit_test, orbit_host_support.h for the
    native preview) stand in for the HAL: give them FM1_NBTN, FM1_NENC and FL_JEDEC_OK with the FM-1 values. Run the
    fork's own checks too (orbit_check.py, orbit_preview_test.py), not only run_tests.sh.
  - A fork with its own installer page (ORBIT: installer.js, a manifest of one release package) needs more than the
    library: a manifest that lists every model's package and a page that picks the connected keyboard's. Keep the
    single-package manifest byte for byte, add a "packages" list only when there are more.
  - Do not let the pad picker take the screen on a PRESETS turn when the fork shows its own list there.
  - Pad colours: read them from the screen's palette at run time (RGB565 to 8 bits), not a copy of SLOOP's table.
  - Timed CPU budgets in the regression suite are noise on a busy host ("a note, not a failure"); compare failing
    suites, not log lines. ORBIT's soak test can fail on the base too (an active voice after stop): a flake, not the port.
