# smk37-port.yaml: every decision for one SMK-37 port, in one place.
#
# The agent copies this file into the firmware repository, fills it from the owner's answers (AGENTS.md, step 0)
# and implements it in step 4. Change the file first, then the code. Patterns: docs/06-mapping-patterns.md.
# Filled examples: examples/sloop.yaml, examples/rainbow.yaml, examples/ghoulbox.yaml, examples/choralroot.yaml,
# examples/orbit.yaml, examples/amb.yaml.

firmware:
  name: ""                  # the project's own name, unchanged on the SMK-37 (no "xxx37"); a new firmware names itself
  upstream: ""              # the FM-1 firmware's repository URL; empty for a new firmware
  base: ""                  # the release or commit the port starts from
  family: sloop             # sloop | felucca | other  (AGENTS.md step 1: git merge-base)
  board_layer: sloop        # sloop (genkigenki/sloop-fm1 smk37, on SLOOP 2.6) | felucca (genkigenki/Felucca smk37,
                            # on Felucca 1.6) | by_hand
  lost_on_smk: []           # features the SMK cannot keep, told to the owner, e.g. [TRS MIDI IN / clock in]
  priorities:               # the features that must feel right on the SMK, most important first
    - ""

delivery:
  mode: upstream            # upstream: a PR to the original (someone else's firmware) | own (a new firmware)
  pr: ""                    # the pull request, once opened
  fork: ""                  # until merged: the porter's fork of the original and branch (e.g. <porter>/Felucca
                            # <project>-smk37); archived once the PR is merged
  package: ""               # <project>-smk37.fwsc, <project>-smk37-elite.fwsc, <project>-smk37-mke.fwsc
  usb_name: ""              # the USB / MIDI device name (keep the firmware's); every installer's filter includes it
  data_family: ""           # store owner tag (SMK_DATA_FAMILY in build.py, 1..7 of A-Z 0-9). Own family: other
                            # firmwares' data is cleared on a switch (and this one's on a switch back). The upstream
                            # family: data survives switching between fork and upstream. The owner decides.
  copyright: ""             # the porter's name in the new SMK files' headers, e.g. "M. Geisler (genkigenki/makkuro)"
                            # The project's own name, logo and boot stay; no porter credit or branding on screen.

models:                     # one package per model (MODEL=pro|elite|mke), all three from the start
  - pro                     # SMK-37 Pro; also used for Starrykey 37 Play (its name is too long for a package)
  - elite                   # SMK-37 Elite
  - mke                     # MKE-P37

keys:
  middle: fm1               # keys 5..31 (F3..G5) = the FM-1's 27 keys, velocity from the factory curves
  outer: extend             # extend (more notes) | drums (on a drum track) | transpose | off | custom
  outer_drums:              # when outer is drums, or extend on synth tracks and drums on the drum track
    # C3: kick
  velocity: factory         # factory (the unit's calibration curves) | fixed (one switch in the layer, docs/06 "toy")

pads:
  pattern: steps            # steps | picker | perform | strum | custom   (docs/06, "Pads")
  order: reading            # reading: pads 1-8 top row (hardware pads 0..7), 9-16 bottom (8..15)
  colours: screen           # screen (the screen's track / group colours) | custom
  idle: dark                # dark | dim: what an unused pad shows
  playhead: bright          # how the playhead or a hit shows
  picker:                   # optional: the pad sound picker
    enabled: false
    knob: K4                # turning this knob shows one kind of sound on the pads
    page: "< >"             # buttons that page through the kinds
    pin: KNOB BANK          # the button that keeps the picker open
  velocity: true            # pads play with velocity
  notes: ""                 # anything else the pads do in layers or menus

faders:
  pattern: banks            # banks | mixer | macros | custom
  takeover: soft            # soft: a fader acts only once it moves (also after a bank change) | jump
  bank_button: FADER BANK   # banks only
  banks:                    # banks only: bank -> what fader 1..4 set
    A: [level 1, level 2, level 3, level 4]
  fixed: []                 # mixer / macros: what fader 1..4 set, e.g. [reverb, delay, chorus, volume]
  screen: bar               # bar (a short overlay) | bank_screen (a FADER BANK page) | none

wheels:
  pitch:
    target: bend            # bend | macro | off
    range_semitones: 2
    applies_to: selected    # selected track | all
  mod:
    target: vibrato         # vibrato | macro | filter | off
    detail: ""              # e.g. "10 Hz, up to +-1 semitone" or the macro it drives
  calibration: auto         # auto: centre at power-on, range widens as seen, dead band

rules:
  no_doubles: true          # no control repeats another one's job unless listed here
  doubles_allowed: []

knobs:
  layout: fm1               # fm1: K1 MASTER, K2-K4 the encoders in the firmware's own screen order, K5-K8 KNOB 1-4 | custom
  K1: master                # a virtual MASTER pot (the FM-1's pot is absolute; K1 is an encoder)
  K2: select
  K3: algorithm
  K4: presets
  K5: dial 1
  K6: dial 2
  K7: dial 3
  K8: dial 4
  step: detent              # one encoder step per detent
  pages: {}                 # optional: button -> its page's eight knob columns, e.g. CHORD: [attack 1, ...]

buttons:                    # the FM-1's 14 buttons (docs/04-controls-mapping.md, docs/06 "Buttons")
  map: printed              # printed (by name) | rows (the firmware groups by row) | custom
  names: firmware           # the firmware's own button names in its docs (e.g. SEL or SCL)
  extra:                    # the four buttons the FM-1 does not have
    KNOB BANK: ""
    FADER BANK: ""
    "<": page back
    ">": page forward

screen:
  style: keep               # keep the FM-1 UI | redesign
  colours: ""               # e.g. track colours blue, green, yellow, orange; same on pads and knob caps
  rules:                    # the owner's UX rules; keep them unless the owner removes one
    - group screens by meaning; the knob block at the bottom of the screen
    - the screen shows what you touch first (value next to the thing, a short hint line)
    - same colours and same places on screen and panel
    - no hidden modes; play first, few menus

pedal: none                 # none | sustain | start_stop | custom

modes: {}                   # optional: a second UI in the same firmware (a toy and the full firmware), each with
                            # its own pads / faders / wheels / outer keys / buttons, and how to switch between them

open_questions: []          # anything still to decide with the owner
